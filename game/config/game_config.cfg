; ---------- M6b 캐릭터 플레이 (m6b-character-play, 프로토타입 P4~P18에서 정한 값). 아래 값은 전부 "게임용 임의값"이에요 ----------
[layout]
; 하우스 배치(그림과 걷는 길만 정해요, 결과에 안 들어가요). 단위 m. 게임용 임의값
cell_m = 1.0
aisle_m = 0.9
; 출입구 쪽 빈 땅(장치 줄)과 안쪽 끝 통로의 깊이
front_zone_m = 2.2
back_zone_m = 0.9
; 장치 상자 깊이, 출입구 쪽 벽에서 떨어진 거리
device_depth_m = 0.45
; 베드 높이(그림)
bed_height_m = 0.15

[character]
; 게임용 임의값 (P6에서 걸어 보고 정해요, 질문 A2와 함께)
walk_speed_m_per_s = 1.6
; Shift를 누르면 달리기: 걷는 속도 × 이 값 (P8 1.6 → P15 디렉터 결정 1.75, 게임용 임의값)
run_speed_factor = 1.75
radius_m = 0.22
; 장치에 손이 닿는 거리
reach_m = 0.9

[char_time]
; 일하는 속도 ×1: 게임 1시간 = 현실 N초 (명세 7.1 시작값 180 → P7 120 → P15 디렉터 결정 60). 게임용 임의값
seconds_per_game_hour = 60.0
; 속도 버튼 ×1~×4 배수: 1시간 = 60 / 30 / 20 / 15초. 게임용 임의값
speed_multipliers = [1.0, 2.0, 3.0, 4.0]
; 기상 시각 (자러 가기·며칠 맡기기가 멈추는 시각). 게임용 임의값
wake_hour = 6
; 자러 가기·며칠 맡기기 (광과민 대응, 디렉터 요청 2026-11-20): 빛은 시계를 따르지 않고 "낮 → 밤 → 낮"을 딱 한 번 천천히 보여 주고,
; 그 시간 동안 남은 틱을 고르게 나눠 돌려서 함께 끝나요 (결과는 같고 속도만 달라요). 표현 길이 (현실 초). 게임용 임의값
sleep_cycle_seconds = 4.0
skip_cycle_seconds = 8.0
; 표현 가운데 밤에 머무는 몫 (0~1, 나머지를 반씩 어두워지기·밝아지기에 써요). 게임용 임의값
rest_night_hold_fraction = 0.2
; 도중에 일하는 상태로 돌아오면(작기 끝, 불러오기) 그때 빛에서 시계 빛으로 옮겨 가는 시간 (초). 게임용 임의값
rest_settle_seconds = 1.5
skip_days_max = 30
; 출입문 창의 "며칠 맡기기" 처음 값 (일). 게임용 임의값
skip_days_default = 3

[camera3d]
; 3D 공간 + 평면 그림(나) 카메라. 게임용 임의값
height_m = 3.1
distance_m = 4.3
fov_deg = 50.0
look_ahead_m = 2.2
; 장치 이름표가 보이는 거리 (m)
label_distance_m = 3.5

[plant_art]
; 캐릭터 평면 그림 높이(모델 파일이 없을 때), 칸 하나에 그리는 포기 수 (m, 개). 게임용 임의값
character_height_m = 1.15
plants_per_cell = 8

[plant_models]
; P7: 포기 3D 모델 자리(art/models/plant_stage1~4, plant_dead)와 덧붙이는 작은 모델(flower, fruit_green, fruit_red).
; 덧붙임 위치 = 포기 원점(베드 윗면 가운데) 기준 [x, y, z] m, 크기 단계마다. 포기와 같이 돌고 커져요. 전부 게임용 임의값
flower_offsets_stage1 = [[0.0, 0.07, 0.02]]
flower_offsets_stage2 = [[-0.03, 0.10, 0.03], [0.04, 0.11, 0.0]]
flower_offsets_stage3 = [[-0.05, 0.13, 0.04], [0.05, 0.14, 0.01], [0.0, 0.15, -0.04]]
flower_offsets_stage4 = [[-0.06, 0.15, 0.05], [0.06, 0.16, 0.02], [0.0, 0.17, -0.05], [0.02, 0.15, 0.08]]
fruit_green_offsets_stage1 = [[0.05, 0.0, 0.05]]
fruit_green_offsets_stage2 = [[-0.08, 0.0, 0.06], [0.08, 0.0, 0.05]]
fruit_green_offsets_stage3 = [[-0.11, 0.0, 0.07], [0.11, 0.0, 0.06], [0.0, 0.0, 0.12]]
fruit_green_offsets_stage4 = [[-0.13, 0.0, 0.08], [0.13, 0.0, 0.07], [0.0, 0.0, 0.14]]
fruit_red_offsets_stage1 = [[-0.05, 0.0, 0.05]]
fruit_red_offsets_stage2 = [[0.0, 0.0, 0.09]]
fruit_red_offsets_stage3 = [[-0.06, 0.0, 0.11], [0.07, 0.0, 0.10]]
fruit_red_offsets_stage4 = [[-0.07, 0.0, 0.13], [0.08, 0.0, 0.12], [0.12, 0.0, -0.04]]
; 열매는 땅에 늘어진 모양이라 살짝 기울여요 (도)
fruit_tilt_deg = 70.0
; 포기마다 꾸밈 변화 (고정값에서 만든 값, 시뮬레이션과 무관)
yaw_jitter_deg = 30.0
scale_jitter = 0.12

[light]
; 꾸밈 빛 (게임용 임의값). 해 높이는 시각에서만 계산해요
sun_energy_day = 0.85
ambient_energy = 0.45
shadows = true

[cover]
; P7: 피복 겹·측창을 상태(get_house_controls의 cover_layers, window_open_fraction)대로 그리기. 전부 게임용 임의값
; 겹 사이 간격 (m, 바깥 겹 = 0이 가장 바깥)
layer_spacing_m = 0.08
; 옆벽 높이 = 측창이 걷히는 범위 위쪽 (m), 측창 아래 고정 비닐 높이 (m)
wall_height_m = 1.0
window_sill_m = 0.12
; 아치 비닐을 그리는 각도 (도, 옆에서부터). 그 위는 카메라 시야를 위해 비워요
arch_cut_deg = 58.0
; 창 여닫힘 애니메이션 시간 (초)
window_anim_seconds = 0.6
; 겹마다 비닐 투명도
film_alpha = 0.13
; 측창 비닐 투명도(덜 투명하게, 열린 틈으로 바깥 땅이 또렷이 보여요. P15, 게임용 임의값)
window_film_alpha = 0.34

[ui]
; 캐릭터 화면 HUD 크기 (P9, 게임용 임의값). 기준 높이에서의 배율: 1.0 = 예전 1280×720 설계 크기를 기준 높이 화면 픽셀로.
; 0.95면 1920×1080에서 예전의 약 63%예요. 다른 화면 높이에서는 (창 높이 / ui_reference_height_px)배로 커지거나 줄어요 (명세 2.3).
ui_scale = 0.95
; UI 크기의 기준 화면 높이 (px). 이 높이에서 ui_scale이 그대로 쓰여요 (게임용 임의값, 디렉터가 본 1920×1080)
ui_reference_height_px = 1080
; 도구 줄 (P10, 게임용 임의값): 처음에 보일지(false = 숨김, Tab으로 고정), 미끄러지는 시간(초), 단축키로 잠깐 보이는 시간(초)
toolbar_default_shown = false
toolbar_slide_seconds = 0.2
toolbar_peek_seconds = 1.2
; 도움말 글 자리 높이 (설계 픽셀, ui_scale을 곱해요). 주제 1~11이 스크롤 없이 들어가는 높이, 조작법은 이 안에서 스크롤 (P14, 게임용 임의값)
help_text_height = 380

[fans]
; P15 천장 유동팬 (그림만, 켜짐·꺼짐은 get_house_controls().fan_on). 게임용 임의값
; 출입구 쪽 첫 팬 말고 더 다는 팬 수 (모두 count + 1대가 가운데 줄에 고르게)
count = 4
; 매다는 높이 (m)
height_m = 2.3
; 출입구 쪽 팬(가운데 줄 첫 팬) 높이와 자리 (m, 하우스 z: 0 = 베드 시작, 음수 = 출입구 쪽 빈 땅). P17, 게임용 임의값
entrance_height_m = 2.75
entrance_z_m = -1.4
; 마지막 팬 자리 = 베드 끝 + 이 값 (m). 그 사이를 고르게 나눠요
last_z_from_end_m = -2.0
; P16 사라짐: u = 캐릭터 z − 팬 z. u ≥ fade_full_m이면 다 보이고, u ≤ fade_gone_m이면 다 사라져요 (그 사이 부드럽게).
; 팬이 캐릭터 뒤(카메라 쪽)로 갈수록 사라져서 카메라와 캐릭터 사이를 가리지 않아요
fade_full_m = -0.3
fade_gone_m = -2.8
spin_rad_per_s = 14.0
spin_up_seconds = 1.5
; 그림 크기 배율 (조금 작게 해서 멀리 있는 베드를 덜 가려요)
scale = 0.8

[outside]
; P18 바깥 세상 (꾸밈): 큰 땅 평면 하나 + 그라데이션 하늘 + 안개. 게임용 임의값
; 땅 한 변 (m). 안개로 끝이 안 보이게 충분히 크게
ground_size_m = 3000.0
ground_color_a = "#a9bf86"
ground_color_b = "#8fa86e"
; 안개 짙기 (지수). 하우스 안 흐림과 먼 땅이 지평선에 녹는 정도를 함께 정해요
fog_density = 0.012
