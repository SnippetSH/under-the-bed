; 게임 쪽 설정 (M6 프로토타입). 전부 "게임용 임의값"이에요: 화면 표현과 입력 기본값이고 시뮬레이션 파라미터가 아니에요.
; 시뮬레이션 결과에 들어가지 않아요 (자동 물 주기 설정만 명령으로 바뀌어 결과에 영향을 줘요).

[time]
; 배속 단계별 초당 틱 수 (0 = 일시정지). 게임용 임의값: 1시간 / 6시간 / 하루 / 열흘 = 1초
ticks_per_second = [0, 1, 6, 24, 240]
; 한 프레임에 돌리는 틱 상한. 걸리면 배속이 실제로 느려질 뿐 결과는 같아요
max_ticks_per_frame = 48
; 1작기 길이(틱), tools/season_regression.py와 같은 263일. 게임용 임의값
season_ticks = 6312

[auto_irrigation]
; 직접 플레이 기본값 (m6-overview 6.5). 자동 처방 관전은 enabled가 꺼짐
enabled = true
hour = 8
amount_mm = 4.0

[visual]
; 크기 단계 문턱 (leaf_g_per_m2), 게임용 임의값
leaf_stage_thresholds_g_per_m2 = [35.0, 60.0, 90.0]
; 과실이 이 값 이상이면 "익어 가는 과실" 표시 (development_index), 게임용 임의값
ripening_min_index = 0.8
cell_px = 44
harvest_flash_seconds = 0.6
dev_panel_default_on = true
notification_seconds = 6.0

[colors]
; 게임용 임의값 (placeholder)
soil = "#6b4f33"
soil_dry = "#7b6040"
plant_leaf = "#3f8f3a"
plant_leaf_dark = "#2d6b2b"
dead_plant = "#8a7a4a"
flower = "#f4f0ea"
fruit_green = "#b9d46b"
fruit_ripe = "#d8283a"
mulch_clear_film = "#b9d8e8"
mulch_black_film = "#222222"
mulch_white_film = "#ece9e0"
selection = "#ffd34d"
harvest_flash = "#ff8a3d"

[defaults]
; 행동 입력칸 기본값 (게임용 임의값)
irrigate_mm = 4.0
compost_kg_per_m2 = 2.0
fertilizer_g_per_m2 = 5.0
lime_g_per_m2 = 100.0
disinfectant_g_per_m2 = 30.0
inoculant_g_per_m2 = 5.0
plants_per_m2 = 8.0
thin_per_plant = 3.0
predators_per_m2 = 2.0
heater_setpoint_degC = 8.0

[start]
; 시작 화면의 판 (시나리오 파일은 game/data 안, 빌드가 data/를 복사해 둬요)
params = "res://data/params.toml"
