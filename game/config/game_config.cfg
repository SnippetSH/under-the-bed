; 게임 쪽 설정 (M6a 점검 화면 + M6b 캐릭터 화면). 전부 "게임용 임의값"이에요: 화면 표현과 입력 기본값이고 시뮬레이션 파라미터가 아니에요.
; 시뮬레이션 결과에는 들어가지 않아요. 단, 자동 물 주기 설정은 명령으로 바뀌어 결과에 영향을 줘요(m6-overview 6.5).

[game]
; 세이브 요약에 적는 게임 이름표 (표시용)
version = "M6b"

[time]
; 배속 단계별 초당 틱 수 (0 = 일시정지). 게임용 임의값: 1시간 / 6시간 / 하루 / 열흘 = 1초
ticks_per_second = [0, 1, 6, 24, 240]
; 한 프레임에 돌리는 틱 상한. 걸리면 배속이 실제로 느려질 뿐 결과는 같아요
max_ticks_per_frame = 48
; 자동 저장 간격 (게임 날짜). 틱 수가 이 일수 x 24의 배수가 될 때 저장해요 (m6-overview D4)
autosave_interval_days = 7

[auto_irrigation]
; 직접 플레이 기본값 (m6-overview 6.5). 자동 처방 관전은 시나리오 항목이 켜짐 여부를 정해요
enabled = true
hour = 8
amount_mm = 4.0

[saves]
; 수동 저장 칸 수 (게임용 임의값)
manual_slots = 6

[visual]
; 크기 단계 문턱 (leaf_g_per_m2), 게임용 임의값
leaf_stage_thresholds_g_per_m2 = [35.0, 60.0, 90.0]
; 과실이 이 값 이상이면 "익어 가는 과실" 표시 (development_index), 게임용 임의값
ripening_min_index = 0.8
cell_px = 44
harvest_flash_seconds = 0.6
dev_panel_default_on = true
notification_seconds = 6.0
; 행동 단추의 "지금 할 수 있는가" 판정 갱신 간격 (초), 게임용 임의값
action_refresh_seconds = 0.25
; 개발자 패널 갱신 간격 (초), 게임용 임의값
dev_refresh_seconds = 0.25
; 개발자 패널 이벤트 기록에 보여 주는 줄 수, 게임용 임의값
dev_event_lines = 60
; 개발자 오버레이 색 (낮은 값 -> 높은 값)과 투명도, 게임용 임의값
overlay_low = "#2b4a8f"
overlay_high = "#f0c040"
overlay_alpha = 0.6

[colors]
; 게임용 임의값 (placeholder)
soil = "#6b4f33"
soil_dry = "#7b6040"
plant_leaf = "#3f8f3a"
plant_leaf_dark = "#2d6b2b"
dead_plant = "#8a7a4a"
flower = "#f4f0ea"
fruit_green = "#b9d46b"
fruit_ripe = "#d8283a"
mulch_clear_film = "#b9d8e8"
mulch_black_film = "#222222"
mulch_white_film = "#ece9e0"
selection = "#ffd34d"
harvest_flash = "#ff8a3d"
background = "#212621"
; 위에 겹쳐 뜨는 패널(저장 목록, 종료 화면) 바탕
panel_overlay = "#1a1e1a"
notice = "#ffd980"
warning = "#ff8a7a"
dev_title = "#ffcc4d"

[inputs]
; 행동 입력칸: [기본값, 최소, 최대, 간격]. 게임용 임의값 (코어가 최종 검증해요)
irrigate_mm = [4.0, 0.0, 100.0, 0.5]
compost_kg_per_m2 = [2.0, 0.0, 20.0, 0.5]
fertilizer_g_per_m2 = [5.0, 0.0, 500.0, 0.5]
lime_g_per_m2 = [100.0, 0.0, 1000.0, 10.0]
disinfectant_g_per_m2 = [30.0, 0.0, 200.0, 1.0]
inoculant_g_per_m2 = [5.0, 0.0, 100.0, 1.0]
plants_per_m2 = [8.0, 1.0, 20.0, 1.0]
thin_per_plant = [3.0, 0.0, 30.0, 1.0]
predators_per_m2 = [2.0, 0.0, 50.0, 1.0]
; 난방 설정 온도: 기본값만 여기서 정하고 최소·최대는 카탈로그(코어 파라미터)가 정해요
heater_setpoint_degC = [8.0, 0.0, 30.0, 1.0]
; 피복 겹수: 기본값만 여기서 정하고 최소·최대는 카탈로그가 정해요
cover_layers = [3.0, 2.0, 4.0, 1.0]
; 자동 물 주기 입력칸 (시각, 양)
auto_hour = [8.0, 0.0, 23.0, 1.0]
auto_mm = [4.0, 0.0, 100.0, 0.5]

[start]
; 파라미터 파일 (빌드가 data/를 game/data/로 복사해 둬요)
params = "res://data/params.toml"
; 시작 화면 목록 순서 (아래 [scenario_<id>] 항목)
scenario_order = ["direct_play", "season_standard", "season_n_excess", "season_k_low", "season_k_excess", "season_no_topdress", "season_acid", "season_thinned"]
; M6b 캐릭터 플레이로 시작할 수 있는 판 (아래 [scenario_<id>] 항목, mode는 "direct"여야 해요). 게임용 임의값
char_scenario_order = ["direct_play", "char_planted"]

; 시나리오 항목: label(표시 이름), description, path, season_ticks(작기 길이, 0이면 종료 화면 없음),
; mode("direct" = 일정표 끔, "watch" = 일정표 켬), auto_irrigation(처음 켤지).
; 6312틱 = 263일은 tools/season_regression.py와 같은 기준이에요 (게임용 임의값).
[scenario_direct_play]
label = "직접 플레이"
description = "빈 밭에서 시작해요 (9월 10일). 밑거름과 정식부터 전부 직접 해요. 자동 물 주기가 켜져 있어요."
path = "res://data/scenarios/m6/direct_play.toml"
season_ticks = 6312
mode = "direct"
auto_irrigation = true

; M6b 캐릭터 플레이 전용 항목 (점검 화면 목록 scenario_order에는 없어요): 표준 작기의 밭·기상·심어 둔 작물에서 시작하고
; 처방 일정표는 끄고 전부 직접 해요 (프로토타입 "캐릭터 플레이"와 같은 판)
[scenario_char_planted]
label = "심어 둔 밭"
description = "표준 작기와 같은 밭에 모종이 심어진 채로 시작해요 (9월 10일). 처방 일정표 없이 관리부터 직접 해요. 자동 물 주기가 켜져 있어요."
path = "res://data/scenarios/m4/season_standard.toml"
season_ticks = 6312
mode = "direct"
auto_irrigation = true

[scenario_season_standard]
label = "표준 작기"
description = "정해진 처방(일정표)대로 1작기를 끝까지 돌려 봐요. 중간에 명령도 넣을 수 있어요."
path = "res://data/scenarios/m4/season_standard.toml"
season_ticks = 6312
mode = "watch"
auto_irrigation = false

[scenario_season_n_excess]
label = "질소 과다"
description = "웃거름 질소를 3배로 준 처방."
path = "res://data/scenarios/m4/season_n_excess.toml"
season_ticks = 6312
