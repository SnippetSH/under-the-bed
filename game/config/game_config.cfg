auto_irrigation = false

[scenario_season_k_low]
label = "칼륨 부족"
description = "황산칼륨 웃거름이 없고 처음 칼륨이 절반인 처방."
path = "res://data/scenarios/m4/season_k_low.toml"
season_ticks = 6312
mode = "watch"
auto_irrigation = false

[scenario_season_k_excess]
label = "칼륨 과다"
description = "황산칼륨 웃거름을 3배로 준 처방."
path = "res://data/scenarios/m4/season_k_excess.toml"
season_ticks = 6312
mode = "watch"
auto_irrigation = false

[scenario_season_no_topdress]
label = "웃거름 없음"
description = "웃거름을 주지 않은 처방."
