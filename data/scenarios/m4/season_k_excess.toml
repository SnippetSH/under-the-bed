# S17 칼륨 과다: 황산칼륨 웃거름 3배 — docs/spec/m4-overview.md "시나리오 테스트 (M4)". 값은 전부 게임용 임의값이에요.
# 길이는 sim-cli의 --ticks로 정해요. 시작: day 253, 틱 0 = 그날 0시.

schema_version = 7

[scenario]
name = "m4/season_k_excess"
seed = 20261118
start_day_of_year = 253
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = true  # M5b: 점적 설치 (house-humidity)

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 4.0  # 기준 토양보다 적게. (2026-11-18 프로토타입 점검으로 조정)
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 1  # (2026-11-18 프로토타입 점검으로 조정)
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 200  # (2026-11-18 프로토타입 점검으로 조정)
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M3 s5_standard, docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "B"
plants_per_m2 = 8.0
initial_establishment_index = 0.0  # (2026-11-18 프로토타입 점검으로 조정)

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (m5-overview 11장 기본값. 병원균 0 = 오염 없음)
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.0
phytophthora = 0.0
anthracnose = 0.0  # M5b: 탄저병균 시작 지수 (foliar-disease 8장)

[foliar]  # M5b 필수: 바깥에서 늘 들어오는 포자 수준 (foliar-disease 8장). 0 = 배경 포자 없음
botrytis_background_index = 0.0
powdery_mildew_background_index = 0.0

[difficulty]
stress_combination = "minimum"

# 기비·웃거름 (2026-11-18 프로토타입 점검 3차: 기비 질산칼슘 없음, 웃거름 질산칼슘 5 g + 황산칼륨 6 g)
[[schedule]]
tick = 0
action = "add_compost"
compost = "mature_manure"
kg_per_m2 = 2.0

# 웃거름 질산칼슘: 11/1~2/28은 절반 2.5 g (겨울 N 줄이기) (2026-11-18 프로토타입 점검으로 조정)
