# S4/S4b 기준: pH 6.2, 21일 — docs/spec/m2-overview.md "시나리오 테스트 (M2)" 표. 값은 전부 게임용 임의값이에요.

schema_version = 7

[scenario]
name = "s4_optimal"
seed = 20261118
start_day_of_year = 244                          # 9월 1일, 게임용 임의값
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = true  # M5b: 점적 설치 (house-humidity)

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25      # M3부터 "CEC 밖 완충". 5.0 − 0.15 × 25 (총 완충력 M2와 동일)
# M3 항목: 전부 게임용 임의값 (docs/spec/m3-overview.md "시나리오 TOML")
cec_mineral_eq_per_m2 = 25.0             # 양토 약 10 cmol/kg
mn_g_per_m2 = 5.0                        # 교환성 Mn 약 20 mg/kg
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0                 # 유효 25 g의 약 6배 (적정 pH 평형)
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "B"       # 모종 등급 (M4 이행, 잎 28 / 관부 16 / 뿌리 12 g/m2)
plants_per_m2 = 8.0
initial_establishment_index = 1.0  # (2026-11-18 프로토타입 점검으로 조정)

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (m5-overview 11장 기본값. 병원균 0 = 오염 없음)
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.0
phytophthora = 0.0
anthracnose = 0.0  # M5b: 탄저병균 시작 지수 (foliar-disease 8장)

[foliar]  # M5b 필수: 바깥에서 늘 들어오는 포자 수준 (foliar-disease 8장). 0 = 배경 포자 없음
botrytis_background_index = 0.0
powdery_mildew_background_index = 0.0

[difficulty]
stress_combination = "minimum"

[[schedule]]
tick = 8
action = "irrigate"
amount_mm = 6.0
repeat_every_ticks = 24
repeat_count = 21

# 낮 환기 (M4 이행): 매일 10시에 창 6개 전부 열고 16시에 닫기 (2026-11-18 프로토타입 점검으로 조정)

