# 빈 시나리오 — M0 완료 기준(1년치 실행, 결정론) 검증용
# 프로세스가 없어서 상태는 틱과 달력만 진행돼요.

schema_version = 3

[scenario]
name = "empty"
seed = 20261118
start_day_of_year = 244                          # 9월 1일 (윤년 없는 달력). 딸기 정식 시기 무렵, 게임용 임의값
weather_csv = "../weather/synthetic_year.csv"    # 이 파일 기준 상대 경로

[house]
# 타일 해상도(포기 단위 / 베드 구간 단위)는 미결정 사항이에요. 크기는 게임용 임의값이에요.
bed_rows = 4
bed_cols = 20

[soil]
# 모든 셀의 초기값 (균일 토양). 전부 게임용 임의값 (docs/spec/m1-overview.md 예시)
field_capacity_mm = 60.0
water_mm = 45.0
soil_temp_degC = 20.0
ph = 6.5
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 5.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[difficulty]
stress_combination = "minimum"
