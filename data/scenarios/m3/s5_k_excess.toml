action = "add_fertilizer"
fertilizer = "potassium_sulfate"
g_per_m2 = 60.0                                   # (2026-11-18 프로토타입 점검으로 조정, 120 -> 60)

[[schedule]]
tick = 336
action = "add_fertilizer"
fertilizer = "potassium_sulfate"
g_per_m2 = 60.0                                   # (2026-11-18 프로토타입 점검으로 조정, 120 -> 60)

[[schedule]]
tick = 8
action = "irrigate"
amount_mm = 6.0
