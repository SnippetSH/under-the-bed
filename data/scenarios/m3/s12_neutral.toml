# S12 neutral: pH 6.5, 과인산석회 200 g/m² (tick 0), 작물 없음, 28일 — phosphorus.md S12.
# 값은 전부 게임용 임의값이에요 (기준 토양 = 이행된 M2 s4_optimal, docs/spec/m3-overview.md).

schema_version = 5

[scenario]
name = "m3/s12_neutral"
seed = 20261118
start_day_of_year = 244                          # 9월 1일, 게임용 임의값
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.5
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[difficulty]
stress_combination = "minimum"

[[schedule]]
tick = 0
action = "add_fertilizer"
fertilizer = "superphosphate"
g_per_m2 = 200.0

[[schedule]]
tick = 8
action = "irrigate"
amount_mm = 6.0
repeat_every_ticks = 24
repeat_count = 28

