# S6 사토: 광물 CEC 1, base_buffer 0.5, 양이온 총량(K·Ca·Mg·Mn·NH4)을 6.4/30.4배 (사토 전체 CEC 6.4 / 양토 30.4, 부식 몫 0.0015 x 3600 = 5.4 포함) — m3-overview S6 행. 처방은 양토와 동일.
# 값은 전부 게임용 임의값이에요 (기준 토양 = 이행된 M2 s4_optimal, docs/spec/m3-overview.md).

schema_version = 5

[scenario]
name = "m3/s6_sand"
seed = 20261118
start_day_of_year = 244                          # 9월 1일, 게임용 임의값
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 0.421053            # NH4도 양이온이라 CEC 비율로 축소 (2.0 x 6.4/30.4)
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 0.5
# M3 항목: 전부 게임용 임의값 (docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 1.0
mn_g_per_m2 = 1.052632
mn_oxide_g_per_m2 = 21.05                     # 100 x 6.4/30.4 (양이온과 같은 CEC 비율로 축소) (2026-11-18 프로토타입 점검으로 조정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 12.631579
ca_g_per_m2 = 84.210526
mg_g_per_m2 = 12.631579
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "B"       # 모종 등급 (M4 이행, 잎 28 / 관부 16 / 뿌리 12 g/m2)
plants_per_m2 = 8.0
initial_establishment_index = 1.0  # (2026-11-18 프로토타입 점검으로 조정)

[difficulty]
stress_combination = "minimum"

[[schedule]]
tick = 0
action = "add_fertilizer"
fertilizer = "ammonium_sulfate"
g_per_m2 = 30.0

