# 엔진 검사용 (M6a, m6-overview 10.1 E2·E4): 코어 명령 17종(Noop 제외)이 전부 일정표에 한 번 이상 들어 있는 짧은 판.
# 기존 M5a·M5b 시나리오에는 포기 제거(remove_plant)·피복 변경·점적 설치 일정표가 없어서 따로 만들었어요.
# 피복 변경 기간(params cover_change_window_doy = 91~243) 안에서 시작하려고 day 240(8월 28일)에 시작하고,
# 점적은 깔지 않은 채 시작해요(install_drip). 작물 없이 시작해 틱 120에 정식해요. 길이 30일 = 720틱.
# 시뮬레이션 기준값이 아니라 래퍼·CLI 일치 확인용이에요. 값은 전부 게임용 임의값이에요.

schema_version = 7

[scenario]
name = "m6/all_commands"
seed = 20261120
start_day_of_year = 240
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = false

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 4.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 1
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 200
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[microbes]
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.05
phytophthora = 0.0
anthracnose = 0.0

[foliar]
botrytis_background_index = 0.05
powdery_mildew_background_index = 0.02

[difficulty]
stress_combination = "minimum"

# 휴작기 안: 피복 2겹으로 (이후 창 명령은 겹 0·1만)
[[schedule]]
tick = 0
action = "set_cover_layers"
layers = 2

[[schedule]]
tick = 1
action = "add_compost"
compost = "mature_manure"
kg_per_m2 = 2.0

[[schedule]]
tick = 1
action = "add_lime"
area = [0, 0, 2, 10]
lime = "calcium_carbonate"
g_per_m2 = 50.0

[[schedule]]
tick = 2
action = "till"

[[schedule]]
tick = 3
action = "irrigate"
amount_mm = 20.0

[[schedule]]
tick = 4
action = "apply_disinfectant"
area = [2, 0, 2, 20]
disinfectant = "dazomet"
g_per_m2 = 30.0

[[schedule]]
tick = 4
action = "set_mulch"
mulch = "clear_film"

[[schedule]]
tick = 5
action = "add_inoculant"
inoculant = "trichoderma_product"
g_per_m2 = 10.0

[[schedule]]
tick = 6
action = "install_drip"

[[schedule]]
tick = 96
action = "set_mulch"
area = [0, 0, 1, 20]
mulch = "none"

[[schedule]]
tick = 120
action = "plant"
seedling_grade = "B"
plants_per_m2 = 8.0

[[schedule]]
tick = 121
action = "set_fan"
on = true

[[schedule]]
tick = 128
action = "irrigate"
amount_mm = 4.0
repeat_every_ticks = 24
repeat_count = 25

[[schedule]]
tick = 130
action = "set_heater"
on = true
setpoint_degC = 8.0

[[schedule]]
tick = 140
action = "add_fertilizer"
area = [0, 0, 4, 10]
fertilizer = "calcium_nitrate"
g_per_m2 = 5.0

[[schedule]]
tick = 150
action = "set_window"
layer = 0
side = "left"
open_fraction = 0.5

[[schedule]]
tick = 158
action = "set_window"
layer = 0
side = "left"
open_fraction = 0.0

[[schedule]]
tick = 200
action = "release_predators"
area = [1, 1, 1, 1]
predator = "persimilis"
per_m2 = 2.0

[[schedule]]
tick = 400
action = "thin_flowers"
per_plant = 1.0

[[schedule]]
tick = 500
action = "remove_plant"
area = [3, 19, 1, 1]
