# S1 숙성 퇴비 — docs/spec/m1-overview.md "시나리오 테스트 (M1)" 표. 값은 전부 게임용 임의값이에요.

schema_version = 3

[scenario]
name = "s1_mature"
seed = 20261118
start_day_of_year = 244                          # 9월 1일, 게임용 임의값
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20

[soil]
field_capacity_mm = 60.0
water_mm = 45.0
soil_temp_degC = 20.0
ph = 6.5
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 5.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[difficulty]
stress_combination = "minimum"

[[schedule]]
tick = 0
action = "add_compost"
compost = "mature_manure"
kg_per_m2 = 3.0
