# S28 점적 대 두상 관수: 9월 10일 정식(day 253), 90일(2160틱), 등급 C 모종(잠복 탄저병 25%), 흑색 필름
# 처방·기후는 m4 season_standard를 90일에 맞춰 줄인 것. 등급 C의 잠복 감염이 접종원이에요
# 점적 설치(drip_installed = true) — 물 튐 없음
# 값은 전부 게임용 임의값이에요. 이 파일은 tools/gen_m5b_scenarios.py가 만들어요(고치려면 스크립트를 고쳐요).

schema_version = 7

[scenario]
name = "m5b/s28_drip"
seed = 20261119
start_day_of_year = 253
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = true

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 4.0  # 기준 토양보다 적게. (2026-11-18 프로토타입 점검으로 조정)
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 1  # (2026-11-18 프로토타입 점검으로 조정)
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 200  # (2026-11-18 프로토타입 점검으로 조정)
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M3 s5_standard, docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "C"
plants_per_m2 = 8.0
initial_establishment_index = 0.0

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (m5-overview 11장 기본값. 병원균 0 = 오염 없음)
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.0
phytophthora = 0.0
anthracnose = 0.0  # M5b: 탄저병균 시작 지수 (foliar-disease 8장)

[foliar]  # 바깥에서 늘 들어오는 포자 수준 (병해 시나리오 기본값: 잿빛곰팡이 0.05, 흰가루병 0.02)
botrytis_background_index = 0.05
powdery_mildew_background_index = 0.02

[difficulty]
stress_combination = "minimum"

# 기비 숙성 퇴비 2 kg/m2

[[schedule]]
tick = 0
action = "add_compost"
compost = "mature_manure"
kg_per_m2 = 2.0

# 흑색 필름 멀칭 (정식 직후)

[[schedule]]
tick = 0
action = "set_mulch"
mulch = "black_film"

# 웃거름: season_standard와 같은 처방 (질산칼슘 5 g, 11/1부터 2.5 g, 황산칼륨 6 g)

[[schedule]]
tick = 343
action = "add_fertilizer"
fertilizer = "calcium_nitrate"
g_per_m2 = 5.0
repeat_every_ticks = 336
repeat_count = 3

[[schedule]]
tick = 1351
action = "add_fertilizer"
fertilizer = "calcium_nitrate"
g_per_m2 = 2.5
repeat_every_ticks = 336
repeat_count = 3

[[schedule]]
tick = 343
action = "add_fertilizer"
fertilizer = "potassium_sulfate"
g_per_m2 = 6.0
repeat_every_ticks = 336
repeat_count = 6

# 표준 관리: 정식 다음 날 칠레이리응애 15마리/m2 (season_standard와 같음)

[[schedule]]
tick = 24
action = "release_predators"
predator = "persimilis"
per_m2 = 15.0

# 관수: 매일 08시 4.0 mm (9/10~10/31), 이후 2.5 mm. 두상 관수 변형은 같은 양을 위에서 줘요

