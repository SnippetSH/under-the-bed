# S26 닫힘(병해 측정용 가을 작기): 측정 창은 창 닫힘 + 난방 6 도
# 가을 작기(9/10 정식, day 253, 등급 B 모종)가 m4 season_standard와 같은 시작·토양·작물·비료·관수·난방·창·피복(3겹)으로 12/1(틱 1968)까지 가요.
# 측정 창 12/1~1/31(day 335~31, 62일): season_standard의 창·난방 일정을 지우고 아래 변형으로 바꿔요. 길이: 시작부터 1/31 끝까지 3456틱.
# 시드 20261119, 배경 포자 잿빛곰팡이 0.05, 흰가루병 0.02
# 값은 전부 게임용 임의값이에요. 이 파일은 tools/gen_m5b_scenarios.py가 만들어요(고치려면 스크립트를 고쳐요).

schema_version = 7

[scenario]
name = "m5b/s26_closed"
seed = 20261119
start_day_of_year = 253
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = true

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 4.0  # 기준 토양보다 적게. (2026-11-18 프로토타입 점검으로 조정)
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 1  # (2026-11-18 프로토타입 점검으로 조정)
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 200  # (2026-11-18 프로토타입 점검으로 조정)
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M3 s5_standard, docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "B"
plants_per_m2 = 8.0
initial_establishment_index = 0.0  # (2026-11-18 프로토타입 점검으로 조정)

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (m5-overview 11장 기본값. 병원균 0 = 오염 없음)
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.0
phytophthora = 0.0
anthracnose = 0.0  # M5b: 탄저병균 시작 지수 (foliar-disease 8장)

[foliar]  # 바깥에서 늘 들어오는 포자 수준 (병해 시나리오 기본값: 잿빛곰팡이 0.05, 흰가루병 0.02)
botrytis_background_index = 0.05
powdery_mildew_background_index = 0.02

[difficulty]
stress_combination = "minimum"

