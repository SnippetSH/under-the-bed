# S21 다조멧 21일 뒤 정식: 다조멧 30 g/m2 + 흑색 필름 7일, 필름 걷고 경운 1회, 21일 뒤(tick 672) Plant. 77일(7 소독 + 70) 실행.
# 기대: 잔류가 다 빠진 뒤라 s21_dazomet_day3보다 뿌리 손상이 작아요.
# 길이는 sim-cli의 --ticks로 정해요: 77일 = 1848틱. 시작: day 191, 틱 0 = 그날 0시.
# 값은 전부 게임용 임의값이에요. 이 파일은 tools/gen_m5a_scenarios.py가 만들어요(고치려면 스크립트를 고쳐요).

schema_version = 7

[scenario]
name = "m5a/s21_dazomet_day21"
seed = 20261119
start_day_of_year = 191
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = true  # M5b: 점적 설치 (house-humidity)

[soil]
field_capacity_mm = 60.0
water_mm = 30.0
soil_temp_degC = 25.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M3 s5_standard, docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (기본값은 m5-overview 11장). 시들음병균 0.5, 역병균 0.5 (오염 토양)
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.5
phytophthora = 0.5
anthracnose = 0.0  # M5b: 탄저병균 시작 지수 (foliar-disease 8장)

[foliar]  # M5b 필수: 바깥에서 늘 들어오는 포자 수준 (foliar-disease 8장). 0 = 배경 포자 없음
botrytis_background_index = 0.0
powdery_mildew_background_index = 0.0

[difficulty]
stress_combination = "minimum"

# 소독 중에도 창을 열어 둠 (필름·약제 효과만 보려고 하우스 가열을 막음)
[[schedule]]
tick = 0
action = "set_window"
layer = 0
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 0
action = "set_window"
layer = 0
side = "right"
open_fraction = 1.0

[[schedule]]
tick = 0
action = "set_window"
layer = 1
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 0
action = "set_window"
layer = 1
side = "right"
open_fraction = 1.0

[[schedule]]
tick = 0
action = "set_window"
layer = 2
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 0
action = "set_window"
layer = 2
side = "right"
open_fraction = 1.0

# 관수 30 mm (포장용수량 근처까지)
[[schedule]]
tick = 0
action = "irrigate"
amount_mm = 30.0

# 약제 소독 dazomet 30.0 g/m2 (표준량 = 잔류 지수 1)
[[schedule]]
tick = 1
action = "apply_disinfectant"
disinfectant = "dazomet"
g_per_m2 = 30.0

# black_film 덮기
[[schedule]]
tick = 1
action = "set_mulch"
mulch = "black_film"

# 필름 걷기 (소독 끝)
[[schedule]]
tick = 168
action = "set_mulch"
mulch = "none"

# 창 전부 열기 (소독 끝)
[[schedule]]
tick = 168
action = "set_window"
layer = 0
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 168
action = "set_window"
layer = 0
side = "right"
open_fraction = 1.0

[[schedule]]
tick = 168
action = "set_window"
layer = 1
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 168
action = "set_window"
layer = 1
side = "right"
open_fraction = 1.0

[[schedule]]
tick = 168
action = "set_window"
layer = 2
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 168
action = "set_window"
layer = 2
side = "right"
open_fraction = 1.0

# 경운 (약제 잔류 절반, 가스 빼기)
[[schedule]]
tick = 168
action = "till"

# 기비 황산암모늄 20 g/m2 (정식 당일)
[[schedule]]
tick = 672
action = "add_fertilizer"
fertilizer = "ammonium_sulfate"
g_per_m2 = 20.0

# 정식 B 8포기/m2 (소독 끝 21일 뒤)
[[schedule]]
tick = 672
action = "plant"
seedling_grade = "B"
plants_per_m2 = 8.0

# 관수: 소독 끝 다음 날부터 매일 08시 4 mm (정식 여부와 무관하게 같음)
[[schedule]]
tick = 176
action = "irrigate"
amount_mm = 4.0
repeat_every_ticks = 24
repeat_count = 70
