repeat_every_ticks = 24
repeat_count = 52

# 웃거름 질산칼슘 5 g + 황산칼륨 6 g, 2주마다
[[schedule]]
tick = 336
action = "add_fertilizer"
fertilizer = "calcium_nitrate"
g_per_m2 = 5.0
repeat_every_ticks = 336
repeat_count = 8

