# S22 7~8월 태양열 소독 후 정식: 7/10 시작, 투명 필름 4주 소독, 9/10(tick 1488) Plant. 182일(62 + 정식 뒤 120일) 실행.
# 기대: 소독으로 시들음병균이 줄어서 네 변형 중 정식 뒤 감염·고사가 가장 작아요. 다른 변형과 x축을 맞추려면 앞 1488틱을 잘라요(tools/run_scenarios.py가 해요).
# 길이는 sim-cli의 --ticks로 정해요: 182일 = 4368틱. 시작: day 191, 틱 0 = 그날 0시.
# 값은 전부 게임용 임의값이에요. 이 파일은 tools/gen_m5a_scenarios.py가 만들어요(고치려면 스크립트를 고쳐요).

schema_version = 6

[scenario]
name = "m5a/s22_fusarium_solar"
seed = 20261119
start_day_of_year = 191
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3

[soil]
field_capacity_mm = 60.0
water_mm = 30.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 4.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 1.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 200.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M4 season_standard, docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (기본값은 m5-overview 11장). 시들음병균 0.5 (오염 토양), 역병균 0
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.5
phytophthora = 0.0

[difficulty]
stress_combination = "minimum"

# 관수 30 mm
[[schedule]]
tick = 0
action = "irrigate"
amount_mm = 30.0

# 투명 필름 4주 (7/10~8/7)
[[schedule]]
tick = 1
action = "set_mulch"
mulch = "clear_film"

# 필름 걷기
[[schedule]]
tick = 672
action = "set_mulch"
mulch = "none"

# 창 전부 열기
[[schedule]]
tick = 672
action = "set_window"
layer = 0
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 672
action = "set_window"
layer = 0
side = "right"
open_fraction = 1.0

[[schedule]]
tick = 672
action = "set_window"
layer = 1
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 672
action = "set_window"
layer = 1
side = "right"
open_fraction = 1.0

[[schedule]]
tick = 672
action = "set_window"
layer = 2
side = "left"
open_fraction = 1.0

[[schedule]]
tick = 672
action = "set_window"
layer = 2
side = "right"
open_fraction = 1.0

# 소독 후 정식 전까지 매일 08시 4 mm (흙이 마르지 않게)
[[schedule]]
tick = 680
action = "irrigate"
amount_mm = 4.0
repeat_every_ticks = 24
repeat_count = 33

# 9/10 정식 B 8포기/m2 (다른 S22 변형과 같은 날짜)
[[schedule]]
tick = 1488
action = "plant"
seedling_grade = "B"
plants_per_m2 = 8.0

# 기비 숙성 퇴비 2 kg/m2
[[schedule]]
tick = 1488
action = "add_compost"
compost = "mature_manure"
kg_per_m2 = 2.0

# 관수: 처음 52일은 매일 08시 4 mm
[[schedule]]
tick = 1496
action = "irrigate"
amount_mm = 4.0
repeat_every_ticks = 24
repeat_count = 52

# 이후 2.5 mm
[[schedule]]
tick = 2744
action = "irrigate"
amount_mm = 2.5
repeat_every_ticks = 24
repeat_count = 68

