# S23 적정 관수: 10/21 시작, 6 mm/일, 다짐 0.1, 난방 20 도(지온 약 20~23 도), 역병균 0.5. 28일. 창은 닫아 둠(시작 상태).
# 기대: 통기가 좋아서 역병 감염이 가장 작아요 (과습 변형 세 개보다 작음).
# 길이는 sim-cli의 --ticks로 정해요: 28일 = 672틱. 시작: day 294, 틱 0 = 그날 0시.
# 값은 전부 게임용 임의값이에요. 이 파일은 tools/gen_m5a_scenarios.py가 만들어요(고치려면 스크립트를 고쳐요).

schema_version = 7

[scenario]
name = "m5a/s23_proper"
seed = 20261119
start_day_of_year = 294
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3
drip_installed = true  # M5b: 점적 설치 (house-humidity)

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.5
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 10.0
labile_C_g_per_m2 = 50.0
labile_N_g_per_m2 = 5.0
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 360.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.1
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M3 s5_standard, 다짐 0.1 (S8 적정), docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "B"
plants_per_m2 = 8.0
initial_establishment_index = 0.0

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (기본값은 m5-overview 11장). 역병균 0.5 (오염 토양), 시들음병균 0
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.5
mycorrhiza = 0.1
fusarium = 0.0
phytophthora = 0.5
anthracnose = 0.0  # M5b: 탄저병균 시작 지수 (foliar-disease 8장)

[foliar]  # M5b 필수: 바깥에서 늘 들어오는 포자 수준 (foliar-disease 8장). 0 = 배경 포자 없음
botrytis_background_index = 0.0
powdery_mildew_background_index = 0.0

[difficulty]
stress_combination = "minimum"

# 난방 설정온도 20.0 도 (지온을 목표 범위에 맞추려고)
[[schedule]]
tick = 0
action = "set_heater"
on = true
setpoint_degC = 20.0

# 질산칼슘 15 g N/m2 (96.8 g/m2, S13과 같음)
[[schedule]]
tick = 0
action = "add_fertilizer"
fertilizer = "calcium_nitrate"
g_per_m2 = 96.8

# 적정 관수: 매일 08시 6 mm
[[schedule]]
tick = 8
action = "irrigate"
amount_mm = 6.0
repeat_every_ticks = 24
repeat_count = 28
