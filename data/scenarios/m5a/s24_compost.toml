# S24 퇴비: s24_no_compost에 숙성 퇴비 4 kg/m2를 tick 0에 넣음, 60일.
# 기대: 길항균 지수가 높고 시들음병균 증식이 느려요 (s24_no_compost보다).
# 길이는 sim-cli의 --ticks로 정해요: 60일 = 1440틱. 시작: day 253, 틱 0 = 그날 0시.
# 값은 전부 게임용 임의값이에요. 이 파일은 tools/gen_m5a_scenarios.py가 만들어요(고치려면 스크립트를 고쳐요).

schema_version = 6

[scenario]
name = "m5a/s24_compost"
seed = 20261119
start_day_of_year = 253
weather_csv = "../../weather/synthetic_year.csv" # 이 파일 기준 상대 경로

[house]
bed_rows = 4
bed_cols = 20
cover_layers = 3

[soil]
field_capacity_mm = 60.0
water_mm = 50.0
soil_temp_degC = 20.0
ph = 6.2
nh4_N_g_per_m2 = 2.0
no2_N_g_per_m2 = 0.0
no3_N_g_per_m2 = 4.0
labile_C_g_per_m2 = 5.0
labile_N_g_per_m2 = 0.5
stable_C_g_per_m2 = 3600.0
stable_N_g_per_m2 = 200.0
# M2 항목: 전부 게임용 임의값 (docs/spec/m2-overview.md 예시)
saturation_mm = 110.0
compaction_index = 0.3
base_buffer_eq_per_m2_per_pH = 1.25
# M3 항목: 전부 게임용 임의값 (기준 토양 = M4 season_standard에서 이분해성 C·N만 줄임(퇴비 없이 오래 재배한 흙), docs/spec/m3-overview.md)
cec_mineral_eq_per_m2 = 25.0
mn_g_per_m2 = 5.0
mn_oxide_g_per_m2 = 100.0            # 산화물 Mn, 게임용 임의값 (ADR-0010, 2026-11-18 개정)
p_fixed_g_per_m2 = 150.0
k_g_per_m2 = 60.0
ca_g_per_m2 = 400.0
mg_g_per_m2 = 60.0
p_g_per_m2 = 25.0
s_g_per_m2 = 3.0

[crop]
seedling_grade = "B"
plants_per_m2 = 8.0
initial_establishment_index = 0.0

[microbes]  # M5a 필수: 모든 셀의 무리별 시작 지수 (기본값은 m5-overview 11장). 길항균 0.3(먹이 부족한 흙), 시들음병균 0.3, 역병균 0
decomposer = 1.0
nitrifier_aob = 1.0
nitrifier_nob = 1.0
antagonist = 0.3
mycorrhiza = 0.1
fusarium = 0.3
phytophthora = 0.0

[difficulty]
stress_combination = "minimum"

# 숙성 퇴비 4 kg/m2 (이분해성 C 공급 -> 길항균 수용력 상승)
[[schedule]]
tick = 0
action = "add_compost"
compost = "mature_manure"
kg_per_m2 = 4.0

# 매일 08시 4 mm
[[schedule]]
tick = 8
action = "irrigate"
amount_mm = 4.0
repeat_every_ticks = 24
repeat_count = 60

# 9/10~10/31 매일 8~18시 창 열기, 이후 닫음
[[schedule]]
tick = 8
action = "set_window"
layer = 0
side = "left"
open_fraction = 1.0
repeat_every_ticks = 24
repeat_count = 52

[[schedule]]
tick = 8
action = "set_window"
layer = 0
side = "right"
open_fraction = 1.0
repeat_every_ticks = 24
repeat_count = 52

[[schedule]]
tick = 8
action = "set_window"
layer = 1
side = "left"
open_fraction = 1.0
repeat_every_ticks = 24
repeat_count = 52

[[schedule]]
tick = 8
action = "set_window"
layer = 1
side = "right"
open_fraction = 1.0
repeat_every_ticks = 24
repeat_count = 52

[[schedule]]
tick = 8
