# 시뮬레이션 파라미터 (ADR-0002, schema_version 4 = M3)
#
# 키 이름에 단위를 붙이고, 값마다 출처를 주석으로 달아요. 출처가 없으면 "게임용 임의값".
# 곡선은 [[x, y], ...] 배열이고 x는 엄격하게 오름차순이에요.
# 각 값의 의미는 docs/spec/ 의 해당 명세(soil-water, soil-temperature, organic-matter, nitrogen,
# aeration, soil-chemistry, strawberry-minimal, cation-exchange, phosphorus, manganese)를 봐요.

schema_version = 4  # sim::kParamsSchemaVersion과 같아야 해요

[house]  # docs/spec/soil-temperature.md
base_offset_degC = 2.0                    # 외기 대비 기본 온도차. 게임용 임의값
solar_gain_degC_per_W_per_m2 = 0.015      # 외부 일사당 온실 효과. 게임용 임의값 (맑은 한낮 약 +10 °C)
solar_transmittance_factor = 0.7          # 피복 일사 투과율 (soil-water와 공유). 게임용 임의값

[soil_water]  # docs/spec/soil-water.md
evap_mm_per_hour_per_W_per_m2 = 0.0004    # 하우스 안 일사당 잠재 증발. 게임용 임의값 (맑은 날 하루 약 2 mm)
evap_base_mm_per_hour = 0.005             # 일사가 없을 때의 기본 증발. 게임용 임의값
evap_moisture_curve = [[0.0, 0.0], [0.3, 0.15], [0.7, 0.8], [1.0, 1.0]]  # x = relative_water. 게임용 임의값
drainage_rate_per_hour = 0.3              # 포장용수량 초과분 중 시간당 배수 비율. 게임용 임의값
drainage_compaction_curve = [[0, 1.0], [0.5, 0.6], [1.0, 0.1]]  # x = compaction_index, y = 배수 속도 배율. 게임용 임의값 (aeration.md)

[soil_temperature]  # docs/spec/soil-temperature.md
relax_rate_per_hour = 0.04                # 토양 온도가 하우스 기온을 따라가는 비율. 게임용 임의값 (시간 상수 약 1일)
heat_degC_per_g_C = 0.4                   # 호흡 탄소 1 g/m²당 토양 온도 상승. 게임용 임의값

[organic_matter]  # docs/spec/organic-matter.md
labile_decay_rate_per_hour = 0.004        # 이분해성 풀 최대 분해 속도. 게임용 임의값 (반감기 약 7일)
stable_decay_rate_per_hour = 0.00002      # 난분해성 풀 최대 분해 속도. 게임용 임의값 (반감기 약 4년)
humification_fraction = 0.3               # 분해된 C 중 난분해성 풀로 가는 비율. 게임용 임의값
humus_C_to_N_ratio = 10.0                 # 새 부식의 C:N비. 게임용 임의값 (토양 유기물 일반 범위)
temp_curve = [[0, 0.05], [10, 0.25], [20, 0.55], [30, 0.85], [37, 1.0], [45, 1.0], [55, 0.5], [65, 0.1]]  # x = 토양 온도 °C. 게임용 임의값
moisture_curve = [[0, 0], [0.2, 0.1], [0.6, 0.8], [0.9, 1.0], [2.0, 1.0]]  # x = relative_water. 게임용 임의값 (과습 억제는 o2_curve)
o2_curve = [[0, 0.15], [0.3, 0.6], [0.6, 1.0], [1, 1.0]]  # x = aeration_index. 게임용 임의값 (aeration.md): 저산소에서 분해 둔화

[nitrification]  # docs/spec/nitrogen.md
step1_rate_per_hour = 0.01                # NH4+ -> NO2- 최대 속도. 게임용 임의값
step2_rate_per_hour = 0.08                # NO2- -> NO3- 최대 속도. 게임용 임의값
temp_curve = [[0, 0], [5, 0.1], [15, 0.5], [25, 0.9], [32, 1.0], [40, 0.6], [50, 0.1]]  # x = 토양 온도 °C. 게임용 임의값
moisture_curve = [[0, 0], [0.3, 0.2], [0.6, 0.8], [0.9, 1.0], [2.0, 1.0]]  # x = relative_water. 게임용 임의값
step1_ph_curve = [[4.5, 0.1], [5.5, 0.5], [6.5, 1.0], [8.0, 1.0], [9.0, 0.6]]  # x = pH. 게임용 임의값
step2_ph_curve = [[4.5, 0.1], [5.5, 0.5], [6.5, 1.0], [7.2, 0.9], [8.0, 0.35], [9.0, 0.1]]  # x = pH. 게임용 임의값 (1단계보다 고pH에서 가파르게 감소)
ammonia_fraction_ph_curve = [[6, 0.0006], [7, 0.0056], [7.5, 0.0175], [8, 0.053], [8.5, 0.15], [9, 0.36], [10, 0.85]]  # x = pH, y = NH3 비율. 헨더슨-하셀바흐 식, pKa 9.25(25 °C)를 구간 선형으로 근사
free_ammonia_inhibition_curve = [[0, 1], [0.05, 0.9], [0.3, 0.4], [1.0, 0.1], [3.0, 0.05]]  # x = 유리 암모니아 지수 g N/m². 게임용 임의값
nitrite_toxicity_threshold_g_N_per_m2 = 2.0  # 아질산 독성 이벤트 임계치. 게임용 임의값
nitrite_alarm_reset_fraction = 0.8        # 임계치의 이 비율 아래로 내려가야 경보 해제. 게임용 임의값
step1_o2_curve = [[0, 0.05], [0.3, 0.5], [0.6, 1.0], [1, 1.0]]  # x = aeration_index. 게임용 임의값 (aeration.md)
step2_o2_curve = [[0, 0.0], [0.3, 0.2], [0.6, 0.8], [0.8, 1.0], [1, 1.0]]  # x = aeration_index. 게임용 임의값. 1단계보다 민감 -> 과습에서 아질산 축적
nitrite_toxicity_ph_curve = [[4.5, 8.0], [5.5, 3.0], [6.5, 1.3], [7.0, 1.0], [9.0, 1.0]]  # x = pH, y = 독성 배율. 게임용 임의값 (산성일수록 HNO2 비율 증가, pKa 약 3.3)

[cation_exchange]  # docs/spec/cation-exchange.md (M3 초안 초기값, 프로토타입 점검 대상)
cec_organic_eq_per_g_C = 0.0015           # 난분해성(부식) C 1 g당 CEC. 게임용 임의값 (부식 CEC 약 90 cmol/kg OM, 일반 범위 하단)
exchange_rate_per_hour = 0.3              # 용액 양이 평형값 쪽으로 움직이는 시간당 비율. 게임용 임의값 (시간 상수 약 3시간)
nh4_retention_factor = 70.0               # 자리에 붙으려는 세기 w. 게임용 임의값 (기준 토양에서 M2 용액 비율 0.1과 같아지도록)
k_retention_factor = 250.0                # 게임용 임의값 (M2 0.03과 같아지도록)
ca_retention_factor = 760.0               # 게임용 임의값 (M2 0.01과 같아지도록)
mg_retention_factor = 380.0               # 게임용 임의값 (M2 0.02와 같아지도록)
solver_iterations = 60                    # φ 이분법 반복 횟수 (수치 해법 상수). double 정밀도 수렴에 충분
buffer_eq_per_pH_per_eq_cec = 0.15        # 광물 CEC 1 eq당 pH 완충력. 게임용 임의값

[antagonism]  # docs/spec/cation-exchange.md "흡수 길항". x = 길항 지수 (용액 K+NH4 당량 / 용액 Ca+Mg 당량)
ca_curve = [[0.0, 1.0], [0.2, 1.0], [0.4, 0.6], [0.7, 0.35], [1.2, 0.15]]  # y = Ca 흡수 능력·수요 상한 배율. 게임용 임의값 (2026-11-18 프로토타입 점검으로 조정)
mg_curve = [[0.0, 1.0], [0.18, 1.0], [0.35, 0.55], [0.6, 0.3], [1.2, 0.1]]  # y = Mg 흡수 능력·수요 상한 배율 (Ca보다 민감). 게임용 임의값 (2026-11-18 프로토타입 점검으로 조정)
min_demand_factor = 0.6                   # Ca·Mg 수요 상한에 거는 길항 배율의 하한. 게임용 임의값, 세포벽 등 최소 Ca·Mg, 2026-11-18 4차 프로토타입 점검 후 신설

[phosphorus]  # docs/spec/phosphorus.md
fixation_rate_per_hour = 0.0015           # 유효 -> 고정 최대 시간당 비율. 게임용 임의값 (pH 곡선 1에서 반감기 약 19일)
fixation_ph_curve = [[4.5, 1.0], [5.5, 0.6], [6.3, 0.2], [6.8, 0.2], [7.5, 0.6], [8.5, 1.0]]  # x = pH, y = 고정 속도 배율. 게임용 임의값 (일반 유효도 도표 모양)
release_rate_per_hour = 0.00005           # 고정 -> 유효 시간당 비율 (pH 무관). 게임용 임의값 (반감기 약 1.6년)

[manganese]  # docs/spec/manganese.md
# Mn 산화물 풀과 pH 의존 흡착력 (ADR-0010, 2026-11-18 개정)
retention_ph_curve = [[4.5, 450.0], [5.0, 500.0], [5.1, 900.0], [5.3, 1500.0], [6.5, 1500.0], [7.5, 1800.0], [8.5, 2000.0]]  # x = pH, y = 교환 세기 w_Mn. 게임용 임의값 (2026-11-18 프로토타입 점검으로 조정)
oxidation_rate_per_hour = 0.002          # Mn2+ -> 산화물 최대 시간당 비율. 게임용 임의값 (pH 6.5·통기 충분 반감기 약 2주)
oxidation_ph_curve = [[4.5, 0.005], [5.0, 0.02], [5.3, 0.06], [5.5, 0.12], [5.8, 0.3], [6.0, 0.5], [6.5, 1.0], [7.0, 2.0], [7.5, 4.0], [8.5, 10.0]]  # x = pH. 지수 모양 구간 선형 근사. 게임용 임의값
oxidation_o2_curve = [[0, 0.0], [0.3, 0.2], [0.6, 0.8], [0.8, 1.0], [1, 1.0]]  # x = aeration_index. 게임용 임의값
reduction_rate_per_hour = 0.00006        # 산화물 -> Mn2+ 최대 시간당 비율. 게임용 임의값 (기준 토양에서 산화 ≈ 환원)
reduction_ph_curve = [[4.5, 6.0], [5.0, 3.0], [5.5, 1.8], [6.5, 1.0], [7.5, 0.5], [8.5, 0.3]]  # x = pH. 게임용 임의값
reduction_o2_curve = [[0, 20.0], [0.2, 10.0], [0.4, 4.0], [0.6, 1.5], [0.8, 1.0], [1, 1.0]]  # x = aeration_index. 게임용 임의값

[aeration]  # docs/spec/aeration.md
compaction_cap_curve = [[0, 1.0], [0.5, 0.8], [1.0, 0.35]]  # x = compaction_index, y = 통기 지수 상한. 게임용 임의값
organic_C_cap_bonus_per_g_C = 0.00004     # 유기 C 1 g/m²당 상한 증가. 게임용 임의값 (유기 C 3,600 g/m²에서 +0.14)
compaction_per_mm_irrigation = 0.0015     # 관수 1 mm당 다짐 증가. 게임용 임의값
tilled_compaction_index = 0.1             # 경운 직후 다짐 지수. 게임용 임의값
till_root_damage_fraction = 0.5           # 작물이 있을 때 경운하면 깎이는 뿌리 건강도 비율. 게임용 임의값

[ions]  # docs/spec/soil-chemistry.md "이온" — 원소 기준 1 당량의 무게 [g/eq]
nh4_N_g_per_eq = 14.007                   # N 원자량, 1가
no3_N_g_per_eq = 14.007                   # N 원자량, 1가
no2_N_g_per_eq = 14.007                   # N 원자량, 1가
k_g_per_eq = 39.098                       # K 원자량, 1가
ca_g_per_eq = 20.039                      # Ca 원자량 / 2
mg_g_per_eq = 12.153                      # Mg 원자량 / 2
p_g_per_eq = 30.974                       # H2PO4- 1가로 단순화
s_g_per_eq = 16.03                        # SO4 2-, S 원자량 / 2
mn_g_per_eq = 27.469                      # Mn 원자량 54.938 / 2, 2가 (docs/spec/manganese.md)

[soil_chemistry]  # docs/spec/soil-chemistry.md
p_solution_fraction = 0.002               # 게임용 임의값 (S4에서 고pH일 때 흡수 능력이 수요보다 작아지도록 잡음)
s_solution_fraction = 0.8                 # 게임용 임의값 (황산은 잘 녹고 잘 씻김)
nitrification_H_eq_per_eq_N = 2.0         # 화학량론: NH4+ + 2O2 -> NO3- + 2H+ + H2O
uptake_H_eq_per_eq_NH4 = 1.0              # 전하 균형: NH4+ 흡수 시 H+ 방출
uptake_H_eq_per_eq_NO3 = -1.0             # 전하 균형: NO3- 흡수 시 OH- 방출 (음수)
organic_C_buffer_eq_per_g_C_per_pH = 0.002  # 유기 C 1 g/m²당 완충력. 게임용 임의값
ph_min = 3.0                              # pH 계산 하한. 게임용 임의값 (극한 입력 안전장치)
ph_max = 10.0                             # pH 계산 상한. 게임용 임의값
lime_dissolution_rate_per_hour = 0.004    # 미용해 석회 최대 시간당 용해 비율. 게임용 임의값 (최적 조건 반감기 약 7일)
lime_dissolution_ph_curve = [[4.5, 1.0], [5.5, 0.7], [6.5, 0.3], [7.5, 0.05], [8.0, 0.0]]  # x = pH. 게임용 임의값 (산성일수록 빨리 녹음)
lime_dissolution_moisture_curve = [[0, 0], [0.3, 0.3], [0.7, 1.0], [2.0, 1.0]]  # x = relative_water. 게임용 임의값
ec_meq_per_L_per_dS_per_m = 10.0          # 경험식: 용액 EC 1 dS/m = 양이온 약 10 meq/L
ec_min_water_mm = 1.0                     # EC 계산 시 물의 하한 (0 나눗셈 방지). 게임용 임의값

[availability]  # docs/spec/soil-chemistry.md "유효도 곡선". x = pH, y = 0~1. 일반 유효도 도표의 모양을 따른 게임용 임의값
n_ph_curve = [[4.0, 0.5], [5.0, 0.9], [5.5, 1.0], [8.0, 1.0], [9.0, 0.8]]
p_ph_curve = [[4.5, 0.2], [5.5, 0.6], [6.0, 0.95], [6.8, 1.0], [7.5, 0.35], [8.0, 0.1], [8.5, 0.05]]  # 저pH(Fe·Al 고정), 고pH(Ca 고정)에서 감소
k_ph_curve = [[4.0, 0.5], [5.0, 0.8], [5.8, 1.0], [9.0, 1.0]]
ca_ph_curve = [[4.0, 0.3], [5.0, 0.55], [5.5, 0.75], [6.5, 1.0], [9.0, 1.0]]
mg_ph_curve = [[4.0, 0.3], [5.0, 0.55], [5.5, 0.75], [6.5, 1.0], [9.0, 1.0]]

[root_damage]  # docs/spec/strawberry-minimal.md "뿌리 건강도". y = 시간당 손상 비율. 전부 게임용 임의값
waterlog_curve = [[0, 0.01], [0.2, 0.004], [0.4, 0.0005], [0.5, 0]]  # x = aeration_index
heat_curve = [[32, 0], [35, 0.002], [40, 0.01], [45, 0.03]]  # x = 토양 온도 °C. 환기 없는 M2 하우스 기준, M7에서 재검토
nitrite_curve = [[0, 0], [2, 0], [4, 0.004], [8, 0.015]]  # x = 유효 아질산 g N/m² (pH 배율 적용 후)
acid_curve = [[4.0, 0.006], [4.6, 0.0018], [5.0, 0.0006], [5.4, 0.0001], [5.6, 0.0]]  # x = pH. ADR-0007 (알루미늄 독성 근사)

[crop]  # docs/spec/strawberry-minimal.md
specific_leaf_area_m2_per_g = 0.02        # 잎 1 g당 잎 면적 (200 cm²/g). 게임용 임의값
light_interception_curve = [[0, 0], [0.5, 0.3], [1, 0.5], [2, 0.75], [3, 0.88], [4, 0.94]]  # x = LAI. 지수 감쇠(k 약 0.7) 모양
par_fraction = 0.48                       # 일사 중 광합성 유효광 비율. 일반값
light_use_efficiency_g_per_MJ = 2.5       # 받은 PAR 1 MJ당 건물 생산. 작물 일반 범위
temp_curve = [[3, 0], [8, 0.3], [15, 0.8], [20, 1.0], [25, 1.0], [30, 0.6], [35, 0.2], [40, 0]]  # x = 하우스 기온 °C. 딸기 생장 적온 대략 18~25 °C
leaf_allocation_fraction = 0.7            # 생장량 중 잎 비율 (나머지 뿌리). 게임용 임의값
water_stress_curve = [[0.2, 0], [0.4, 0.3], [0.6, 0.9], [0.75, 1.0], [2.0, 1.0]]  # x = relative_water. 게임용 임의값
salt_stress_curve = [[0, 1], [2.0, 1.0], [3.5, 0.6], [5.5, 0.25], [8, 0.05]]  # x = 토양 용액 EC dS/m. 딸기는 염류에 약함. 게임용 임의값
nutrient_stress_curve = [[0, 0], [0.5, 0.3], [0.8, 0.8], [1.0, 1.0]]  # x = 충족도. 게임용 임의값
target_N_g_per_g = 0.028                  # 적정 체내 농도 (건물 1 g당). 딸기 잎 분석 적정 범위 대략 2.0~2.8%
target_P_g_per_g = 0.0035                 # 대략 0.2~0.4%
target_K_g_per_g = 0.020                  # 대략 1.1~2.5%
target_Ca_g_per_g = 0.012                 # 대략 0.5~1.5%
target_Mg_g_per_g = 0.004                 # 대략 0.25~0.45%
luxury_uptake_ratio = 1.3                 # 적정 농도의 몇 배까지 더 먹는지. 게임용 임의값
uptake_rate_per_g_root_per_hour = 0.002   # 뿌리 1 g당 유효량에서 시간당 가져갈 수 있는 비율. 게임용 임의값
ca_uptake_rate_per_g_root_per_hour = 0.00019  # Ca 전용 흡수 비율 (s5_standard 낮 흡수 능력 여유 약 4배). 게임용 임의값, Ca는 뿌리 끝에서만 흡수돼 효율이 낮음, 2026-11-18 프로토타입 점검으로 신설
mg_uptake_rate_per_g_root_per_hour = 0.00021  # Mg 전용 흡수 비율 (여유 약 4배). 게임용 임의값, 2026-11-18 프로토타입 점검으로 신설
transpiration_mm_per_hour_per_W_per_m2 = 0.0015  # 하우스 안 일사 x 받는 빛 비율 1 W/m²당 증산. 게임용 임의값 (맑은 날 하루 약 1.5~2.5 mm)
root_recovery_rate_per_hour = 0.002       # 손상이 없을 때 뿌리 건강도 회복 비율. 게임용 임의값
death_root_health = 0.05                  # 이 아래로 내려가면 고사. 게임용 임의값
root_dieback_per_damage = 1.0             # 손상 비율 1당 죽는 뿌리 건물 비율. 게임용 임의값 (과습 손상이 생장에 남도록)
target_Mn_g_per_g = 0.0001                # 적정 체내 농도 (딸기 잎 분석 적정 범위 대략 50~200 mg/kg)
mn_uptake_rate_per_g_root_per_hour = 0.00004  # 뿌리 1 g당 용액 Mn에서 시간당 가져가는 비율. 게임용 임의값 (2026-11-18 프로토타입 점검으로 조정, 3차: 0.00002 -> 0.00004)
mn_max_uptake_ratio = 30.0                # 적정 농도의 몇 배까지 쌓일 수 있는지. 게임용 임의값 (망간은 수동적으로 쌓여 독성까지 감)
mn_toxicity_curve = [[0, 1], [5, 1], [10, 0.7], [20, 0.3], [30, 0.1]]  # x = 체내 Mn / 적정량, y = 생장 계수. 게임용 임의값 (약 500 mg/kg부터 장해)
dry_matter_C_fraction = 0.45              # 건물 중 탄소 비율. 식물 건물 일반값

