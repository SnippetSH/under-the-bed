# 시뮬레이션 파라미터 (ADR-0002, schema_version 7 = M5b)
#
# 키 이름에 단위를 붙이고, 값마다 출처를 주석으로 달아요. 출처가 없으면 "게임용 임의값".
# 곡선은 [[x, y], ...] 배열이고 x는 엄격하게 오름차순이에요.
# 각 값의 의미는 docs/spec/ 의 해당 명세(soil-water, soil-temperature, organic-matter, nitrogen,
# aeration, soil-chemistry, strawberry-minimal, cation-exchange, phosphorus, manganese,
# house-climate, strawberry-phenology, strawberry-fruit, denitrification, house-humidity)를 봐요.

schema_version = 7  # sim::kParamsSchemaVersion과 같아야 해요

[house]  # docs/spec/house-climate.md (다중 피복 열수지, 창, 난방, CO2). 전부 게임용 임의값
layer_transmittance_factor = 0.9          # 피복 한 겹의 일사 투과율. 3중 0.729 = M1의 0.7과 비슷. 게임용 임의값
layer_resistance_m2K_per_W = 0.13         # 피복 한 겹(+ 공기층)의 단열 저항 (지면 면적 기준). 3중 U 약 2.6 W/m²K. 게임용 임의값
infiltration_W_per_m2_per_K = 0.5         # 창을 닫아도 새는 열. 게임용 임의값
window_bypass_fraction = 0.5              # 열린 창 하나가 그 겹의 단열을 없애는 비율 (양쪽 열면 단열 0). 게임용 임의값
window_open_levels = [0, 0.3, 0.5, 0.7, 1.0]  # 허용 개방률 (0부터 엄격 오름차순, 0~1). 디렉터 결정 (2026-11-18, 단계 개방)
vent_conductance_W_per_m2_per_K = 30.0    # 모든 겹 양쪽이 열렸을 때 환기 열 교환 (맞통풍). 게임용 임의값
solar_heat_gain_fraction = 0.18  # 투과 일사 중 기온을 올리는 몫 (M1 식과 맞추던 0.063에서 올림: 닫힌 3중 1월 맑은 한낮 약 20~25 °C). 게임용 임의값 (2026-11-18 프로토타입 점검으로 조정) [이전 0.063]
ground_heat_W_per_m2 = 6.1                # 지중 열 등 기본 열 유입 (M1 base_offset 2 °C와 맞춤). 게임용 임의값
air_relax_rate_per_hour = 0.7             # 기온이 평형값을 따라가는 시간당 비율 (열 관성). 게임용 임의값
heater_capacity_W_per_m2 = 150.0          # 난방기 최대 출력 (3중 닫힘에서 바깥보다 약 +45 °C까지). 게임용 임의값
heater_setpoint_min_degC = 0.0            # 난방 설정 온도 하한 (SetHeater 명령 검증용). 게임용 임의값 (2026-11-18 프로토타입 점검으로 신설)
heater_setpoint_max_degC = 30.0           # 난방 설정 온도 상한 (SetHeater 명령 검증용). 게임용 임의값 (2026-11-18 프로토타입 점검으로 신설)
temp_mean_relax_rate_per_hour = 0.042     # 하우스 기온 이동 평균의 시간당 완화 비율 (약 1/24, strawberry-phenology). 게임용 임의값
cover_change_window_doy = [91, 243]       # 피복 겹수를 바꿀 수 있는 기간 [시작, 끝] day_of_year (4월 1일~8월 31일). 디렉터 결정(휴작기)
min_cover_layers = 2                      # 피복 겹수 하한. 게임용 임의값
max_cover_layers = 4                      # 피복 겹수 상한. 게임용 임의값
# CO2 (2026-11-18 디렉터 결정)
# 바깥 CO2 시각별 표: 디렉터 지정 식의 정시 값. tools/gen_co2.py로 생성 (코어는 sin·exp를 계산하지 않아요)
outside_co2_ppm_by_hour = [420.0, 424.0, 428.8, 439.4, 464.7, 494.6, 495.1, 466.2, 441.8, 431.9, 427.6, 423.9, 420.0, 415.2, 402.8, 388.1, 397.3, 404.6, 405.0, 405.5, 407.0, 409.4, 412.5, 416.1]
air_volume_m3_per_m2 = 3.0                # 지면 1 m²당 하우스 공기 부피 (평균 높이 3 m). 게임용 임의값
co2_mg_per_m3_per_ppm = 1.83              # 1 ppm에 해당하는 CO2 질량 농도. 20 °C·1기압: 44/22.4 x 273/293
infiltration_air_changes_per_hour = 0.1   # 창을 닫아도 바뀌는 공기 비율. 게임용 임의값 (국내 다겹 단동 실측 0.056~0.106회/h의 높은 쪽, house-humidity 결정 1) [이전 0.3]
vent_air_changes_per_hour = 30.0          # 모든 겹 양쪽이 열렸을 때 시간당 환기 횟수. 게임용 임의값
co2_floor_ppm = 50.0                      # 하우스 CO2 하한 (광합성 보상점 근처, 계산 안전장치). 게임용 임의값

[humidity]  # docs/spec/house-humidity.md 3장 (수증기 수지, 결로, 잎 젖음, 공기 흐름). M5b 프로토타입 0차 초기값
saturation_vapor_curve = [[-10, 2.35], [-5, 3.41], [0, 4.85], [5, 6.8], [10, 9.4], [15, 12.8], [20, 17.3], [25, 23.0], [30, 30.4], [35, 39.6], [40, 51.1], [50, 83.0], [70, 198]]  # x = 기온 °C, y = 포화 수증기 g/m3. Tetens 식(물 위 a 17.27, b 237.3) [R116], tools/gen_saturation.py로 검산 (명세 표 값 그대로, 식과 0.4% 이내)
inner_surface_resistance_m2K_per_W = 0.06  # 피복 안쪽 면 표면 열저항. 게임용 임의값. 직렬 저항 추정 (안쪽 대류 계수 + 복사 가정, [S102])
condensation_rate_per_hour = 4.0           # 피복 포화 농도를 넘는 수증기의 시간당 결로 속도. 식 모양은 Vanthoor [S102][R101], 크기는 열전달 계수에서 계산한 값 (낮음)
rh_mean_relax_rate_per_hour = 0.014        # 상대습도 이동 평균 완화 비율 (약 3일). 게임용 임의값
vent_airflow_factor = 1.0                  # 환기 경로 1당 공기 흐름 지수. 게임용 임의값
fan_airflow_index = 0.6                    # 유동팬이 주는 공기 흐름 지수. 게임용 임의값 (팬이 있어도 군락 안은 0.1~0.2 m/s에 그칠 수 있음 [R209])
canopy_rh_boost_index = 0.08               # 잎이 빽빽하고 바람이 없을 때 잎 사이 습도 가산. 게임용 임의값
canopy_lai_ref = 3.0                       # 위 가산이 최대가 되는 LAI. 게임용 임의값
dew_rh_index = 0.95  # 잎 사이 습도가 이 이상이면 잎이 젖기 시작. RH 문턱법 90% 부근 [R201], 온실 장미 94% [R203]
dew_solar_limit_W_per_m2 = 50.0            # 하우스 안 일사가 이보다 크면 이슬이 새로 맺히지 않음. 게임용 임의값
wetting_rate_per_hour = 0.5                # 젖음 증가 (1까지 남은 양의 비율). 게임용 임의값
drying_rate_per_hour = 0.6  # 마름 기본 속도. 게임용 임의값
airflow_drying_factor = 2.0                # 공기 흐름 1일 때 마름 속도 추가 배율 (1 + 값). 팬 대 정체 물방울 증발 1.7배 [S201], 풍속 0.1 -> 0.3 m/s에 1.7~3배 [R209][R217] 중간
drying_rh_curve = [[0.5, 1.5], [0.8, 1], [0.95, 0.4], [1, 0]]  # x = 잎 사이 습도, y = 마름 배율. 게임용 임의값
drying_solar_factor_per_W_per_m2 = 0.004  # 하우스 안 일사 1 W/m2당 마름 속도 추가 배율. 게임용 임의값
overhead_wet_index = 1.0                   # 두상 관수 직후 잎 젖음. 게임용 임의값
wet_threshold_index = 0.5                  # 잎 젖음이 이 이상이면 "젖은 시간"으로 셈. 게임용 임의값
wetness_break_hours = 4.0                  # 마른 상태가 이만큼 이어지면 연속 젖음이 끊김. 노스캐롤라이나 경보 기준 4 h [R215] (낮음)

[foliar_disease]  # docs/spec/foliar-disease.md 3장 (M5b). 출처 없는 값은 게임용 임의값, 속도 값은 프로토타입에서 7장 목표값에 맞춰 조정
n_susceptibility_curve = [[0, 1], [6, 1], [12, 1.4], [20, 1.8], [30, 2]]  # x = 토양 무기 N 이동 평균 g/m2, y = 감염 배율. 방향만 근거 [A9][G3], 크기는 게임용 임의값
n_mean_relax_rate_per_hour = 0.003  # 토양 무기 N 이동 평균 완화 비율 (약 2주, 2026-11-19 디렉터 결정)
mite_mean_relax_rate_per_hour = 0.003  # 응애 밀도 이동 평균 완화 비율 (약 2주). 게임용 임의값

[foliar_disease.anthracnose]  # 탄저병 (foliar-disease 3.2)
temp_curve = [[9, 0], [15, 0.16], [20, 0.58], [25, 0.95], [27, 1], [30, 0.91], [35, 0.34], [38, 0]]  # 최저 9, 최적 26.7, 최고 38 [R308] 중간 (C. gloeosporioides 종합, 딸기 관부 전용 곡선 없음)
wetness_curve = [[0, 0], [6, 0.05], [13, 0.8], [36, 1]]  # x = 연속 젖음 h. 최적 온도에서 젖음 13 h에 과실 감염 80% 초과 [R301] 중간
contact_rate_per_hour = 0.0005  # 흙 접종원 1·온도 1·젖음 1일 때 흙에서 올라오는 감염. 게임용 임의값
progress_rate_per_hour = 0.003  # 온도 1일 때 감염된 관부 안의 진행. 게임용 임의값 (잠복 묘의 수확 끝 고사 20~32% [R309]에 맞춤) (5차 프로토타입 2026-11-20: 점적 고사 7.5%, B16) [이전 0.004]
splash_transfer_index = 0.05  # 두상 관수 1회가 압력 1에서 옮기는 감염. 게임용 임의값 (5차 프로토타입 2026-11-20: 두상 감염 2~3배) [이전 0.01]
sporulation_curve = [[0, 0], [0.15, 0], [0.3, 0.5], [0.6, 1]]  # x = 감염 지수, y = 그 포기가 내는 포자. 게임용 임의값 (증상이 보인 뒤부터)
onset_infection_index = 0.15  # DiseaseOnset 기준 (M5a 시들음병과 같은 값)
soil_deposit_per_hour = 0.0003  # 살아 있는 병든 포기가 그 칸 흙 접종원에 더하는 양 (시간당 x sporulation_curve(감염)). 게임용 임의값 (7차 프로토타입: 감염 0.5 포기 아래 길항균 없는 칸이 4주에 약 0.2)
residue_index = 0.3  # 포기가 죽을 때 한 번 남기는 접종원 (x 감염 지수). 뽑은 포기(RemovePlant)는 남기지 않음. 게임용 임의값 (7차 프로토타입)

[foliar_disease.botrytis]  # 잿빛곰팡이병 (foliar-disease 3.3)
infection_temp_curve = [[5, 0.02], [10, 0.08], [15, 0.55], [20, 1], [25, 0.79], [30, 0.11], [33, 0]]  # Bulger 1987 과실 감염 식 (젖음 32 h 값을 20 도로 나눔) 높음. 10 도는 식의 외삽
wetness_curve = [[0, 0], [6, 0.05], [12, 0.15], [16, 0.25], [24, 0.58], [32, 1]]  # x = 연속 젖음 h. 같은 식의 20 도 과실 감염에서 기준선을 뺀 값 높음. 경보 시스템 [R402][R415], 일본 오이타현 기준 [S110]과 같은 방향
infection_rate_per_hour = 0.03  # 포자 1·온도 1·젖음 1일 때 감염 압력 증가. 게임용 임의값
infection_decay_rate_per_hour = 0.002  # 감염 압력 감쇠. 게임용 임의값 (꽃 감염에서 과실 증상까지 2~4주 [R414][R404])
sporulation_temp_curve = [[5, 0.1], [10, 0.4], [15, 0.8], [17.5, 1], [22, 0.8], [25, 0.1], [30, 0]]  # 17~18 도 최대, 25 도 거의 없음, 30 도 없음 [R401] 중간. 사이 점은 임의값
spore_source_per_infection_per_hour = 0.02  # 감염 압력 1인 포기가 온도 1·젖은 상태에서 내는 포자. 게임용 임의값
spore_source_per_rotten_fruit_per_hour = 0.01  # 이번 틱 썩은 과실 1개/m2가 더하는 포자 (2차 전염원). 게임용 임의값
spore_decay_rate_per_hour = 0.02  # 포자 압력 자연 감쇠. 게임용 임의값, 실측 없음
spore_vent_fraction = 0.05  # 환기 횟수 1당 빠지는 비율 (min(1, 값 x ach)). 게임용 임의값, 실측 없음
fruit_rot_prob_per_hour = 0.005  # 감염 압력 1·단계 배율 1일 때 과실 1개가 그 틱에 썩을 확률. 게임용 임의값 (B4에 맞춤) (5차 프로토타입 2026-11-20: B4 닫힘 12% 대 환기 5%) [이전 0.002]
fruit_stage_curve = [[0, 1], [0.15, 0.6], [0.4, 0.2], [0.8, 0.6], [1, 1]]  # x = 과실 발달 0~1 (0 = 개화), y = 썩음 배율. 꽃과 익은 과실이 풋과실보다 잘 걸림 [G1][R406]
onset_infection_index = 0.2  # DiseaseOnset 기준. 게임용 임의값

[foliar_disease.powdery_mildew]  # 흰가루병 (foliar-disease 3.4)
temp_curve = [[5, 0.05], [10, 0.3], [15, 0.7], [20, 1], [25, 1], [30, 0.4], [32, 0]]  # 발아 최적 약 20 도, 병반 확대 최대 25 도 [R418], 15~25 도가 좋음 [R419] 중간
rh_curve = [[0.6, 0], [0.75, 1], [0.95, 1], [1, 0.7]]  # x = canopy_rh_index. 60% 초과에서 발아 [P1], 75~98% 최적, 95% 이상은 포자 생산 감소 [R419]
free_water_inhibition_factor = 0.7  # 잎 젖음 1일 때 감염 감소 비율. 방향은 근거 있음 [P3], 크기는 출처 없음 (게임용)
light_curve = [[0, 1.3], [60, 1.15], [120, 1]]  # x = 하우스 안 일사 하루 이동 평균 W/m2. 게임용 가정 (약광의 정량 근거 없음, 최대 1.3배, 디렉터 결정 5)
density_curve = [[0, 0.8], [2, 1], [4, 1.2]]  # x = LAI. 게임용 가정
young_leaf_curve = [[0, 0.3], [0.01, 0.6], [0.03, 1]]  # x = rgr_mean_per_day. 전개 후 10~15일 잎이 가장 잘 걸림 [R424][R420] 중간 (RGR 대용은 게임용 근사)
infection_rate_per_hour = 0.0025  # 모든 배율 1일 때 병든 잎 면적 증가. 게임용 임의값 (잠복 4~7일 [R419][R424]) (5차 프로토타입 2026-11-20: S32 끝 0.21, B10) [이전 0.004]
spore_source_per_infection_per_hour = 0.02  # 병든 잎 면적 1인 포기가 내는 포자. 게임용 임의값
spore_decay_rate_per_hour = 0.005  # 포자 압력 감쇠. 게임용 임의값 (병든 잎의 포자는 오래 감 [R419])
spore_vent_fraction = 0.05  # 환기 횟수 1당 빠지는 비율. 게임용 임의값
photosynthesis_damage_curve = [[0, 0], [0.17, 0.05], [0.5, 0.2], [1, 0.5]]  # x = 병든 잎 면적, y = 총생산 감소 비율. 잎 병반 17%에서 수량 손실 5% [P2][R422] 중간, 그 위는 임의값
fruit_prob_curve = [[0, 0], [0.1, 0.02], [0.3, 0.08], [0.6, 0.17]]  # x = 병든 잎 면적, y = 흰가루 과실 확률. 감수성 품종 터널 과실 6~17%, 저항성 0.4~2.3% [R207] 높음, 설향은 낮은 쪽
onset_infection_index = 0.05  # DiseaseOnset 기준. 경보 문턱 잎 병반 5% [R422]

[foliar_disease.mites]  # 점박이응애·칠레이리응애 (foliar-disease 3.5)
mite_growth_curve_per_hour = [[12, 0], [15, 0.0013], [20, 0.0044], [25, 0.0063], [30, 0.0079], [35, 0.005], [40, 0]]  # x = 하우스 기온, y = 시간당 내적 증가율. 발육 영점 12~14 도, 콩 20/25/30 도 [R503] 중간. 딸기 25 도 약 0.15 [M2]에 맞춰 줄임 (비율은 게임용)
mite_rh_curve = [[0.2, 0.8], [0.4, 1.15], [0.55, 1.15], [0.7, 1], [0.85, 0.9], [1, 0.8]]  # x = house_rh_mean_index, y = 증가율 배율. 근거 엇갈림 [S407][S408][S409] 대 [R502]. 디렉터 결정 6: 약한 곡선, 크기는 게임용 임의값
